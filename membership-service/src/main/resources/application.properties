server.port=8081
spring.application.name=membership-service

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost

spring.datasource.url=jdbc:mysql://localhost:3306/membership_db?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

app.internal.api-key=change-me-in-prod

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=membership-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=net.fernandosalas.*
spring.kafka.consumer.properties.spring.json.value.default.type=net.fernandosalas.membership.kafka.dto.PurchasePointsMessage
spring.kafka.consumer.properties.spring.json.use.type.headers=false
app.kafka.topic.membership-purchase-points=membership.purchase.points
